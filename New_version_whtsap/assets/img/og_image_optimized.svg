<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25D366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#128C7E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond avec dégradé WhatsApp -->
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <!-- Overlay semi-transparent -->
  <rect width="1200" height="630" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Cercles décoratifs -->
  <circle cx="150" cy="100" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1050" cy="200" r="60" fill="rgba(255,255,255,0.1)"/>
  <circle cx="200" cy="500" r="30" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1000" cy="450" r="50" fill="rgba(255,255,255,0.1)"/>
  <circle cx="400" cy="300" r="35" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Logo WhatsApp (simplifié) -->
  <circle cx="600" cy="200" r="75" fill="white"/>
  <circle cx="600" cy="200" r="65" fill="#25D366"/>
  
  <!-- Texte principal -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white" text-shadow="2px 2px 4px rgba(0,0,0,0.5)">
    الدعوة للانضمام إلى مجموعة واتساب
  </text>
  
  <!-- Sous-titre -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="white" text-shadow="1px 1px 2px rgba(0,0,0,0.5)">
    انضم إلى مجموعة WhatsApp الآن
  </text>
  
  <!-- Bouton stylisé -->
  <rect x="500" y="450" width="200" height="50" rx="25" fill="white"/>
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#25D366">
    انضم الآن
  </text>
</svg>